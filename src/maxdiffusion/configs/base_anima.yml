run_name: 'anima_test_run'

metrics_file: ""
write_metrics: False
write_timing_metrics: False
timing: False
gcs_metrics: False
save_config_to_gcs: False
log_period: 100

pretrained_model_name_or_path: 'circlestone-labs/Anima-Base-v1.0-Diffusers'

# Anima is bf16 end-to-end (T5 ids stay int32).
weights_dtype: 'bfloat16'

seed: 0
output_dir: 'output/'

prompt: "masterpiece, best quality, 1girl, solo, city lights"
negative_prompt: "low quality, blurry, worst quality"

guidance_scale: 4.0
num_inference_steps: 30
num_reps: 3

height: 1024
width: 1024
batch_size: 1
